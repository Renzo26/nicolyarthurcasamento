services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # O Vite embute as VITE_* no bundle durante o build. Configure estas
      # variáveis no painel do EasyPanel (Environment) — elas são lidas aqui
      # e repassadas como build-args.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        VITE_ADMIN_PASSWORD: ${VITE_ADMIN_PASSWORD}
    restart: unless-stopped
    # Sem bloco `networks`: o EasyPanel conecta o contêiner na rede do projeto
    # e cria os aliases que o proxy usa para achar o backend. Declarar a rede
    # externa aqui substitui a rede default do Compose e quebra o roteamento.
    expose:
      - "80"
